services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-football}
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-football} -d ${POSTGRES_DB:-football}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-football}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-football}
      STORAGE_ROOT: /data
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-now}
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-20}
      MEDIA_ACCELERATION: ${MEDIA_ACCELERATION:-auto}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      FORCE_HARDWARE: ${FORCE_HARDWARE:-}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
      BACKGROUND_WORKERS: ${BACKGROUND_WORKERS:-1}
      WORKER_NICE: ${WORKER_NICE:-10}
      AI_DEVICE: ${AI_DEVICE:-auto}
      AI_BATCH_SIZE: ${AI_BATCH_SIZE:-1}
    volumes:
      - media_data:/data
      - /dev/dri:/dev/dri:ro
      - /dev/nvidia0:/dev/nvidia0:ro
    cpus: "${API_CPU_LIMIT:-2.0}"
    mem_limit: ${API_MEMORY_LIMIT:-3g}
    pids_limit: 256
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on: [api]
volumes:
  postgres_data:
  media_data:
