server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20G;
  location /api/ { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_request_buffering off; }
  location / { try_files $uri /index.html; }
}
